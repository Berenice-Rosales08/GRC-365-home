<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forms</title>
<style>
	body {
		background:aliceblue;
	} #page {
		background: rgba(123,122,233,1.00);
		width: 800px;
		height: 1000px;
		margin: 0 auto;
		border-radius: 30px;
	} main {
        width: 80%;
        height: auto;
        margin: 36px auto;
    } form {
        width: 600px;
        margin: 0 auto;
        border-radius: 12px;
        background: rgba(208,224,255,1.00);
        padding: 24px;
        display: flex;
        flex-wrap: wrap;
        flex-direction: column;
        font: 14pt/1.4em Helvetica;
    } #personal input {
        width: 100%;
        height: 35px;
		margin-bottom: 3px;
    } #personal textarea {
        width: 100%;
	}  label {
        margin-top: 12px;
    } select, input[type="submit"] {
        font: 16pt/1.4em Helvetica, sans-serif;
    } input[type="submit"] {
        width: 200px;
        height: 40px;
        margin: 24px auto;
        background: rgba(100,61,233,0.80);
        border-radius: 10px;
    } input[type="submit"]:hover {
        opacity: 0.75;
	} textarea {
		font: 14pt/1.4em Arial, sans-serif;
    }  header h1 {
        font: 24pt/1.4em;
		font-family: Franklin Gothic Heavy;
        text-align: center;
        margin-top: 15px;
		color: azure;
        text-shadow: 2px 3px 6px black;
	} header img {
		width: 100%;
		border-radius: 30px 30px 0px 0px;
	}
</style>
	
</head>

<body>
	<div id="page">
	<header>
		<img src="headerimg.png"/>
		<h1>Contact</h1>
	</header>
	<main>
	<form id="contactform" action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="05667def-c0be-4b34-b735-583d4f0117be">
<div id="personal">	
	<label>Name</label>
  <input type="text" name="name" required>
		
  <label> Email </label>
	<input type="email" name="email" required>
		
  <label> Message </label>
	<textarea name="message" placeholder="&nbsp;Write message here!" required></textarea>
</div>
  <input type="submit" value="Submit">
</form>
	</main>
	</div>
</body>
</html>
