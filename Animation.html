<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Animation</title>
<style>
	body{
	background: rgba(94,123,136,1.00);
	} #page{
	background: rgba(199,236,235,1.00);
	width: 900px;
	height: auto;
	margin: 30px auto;
	border-radius:24px;
	} main {
	width: 780px;
    height: auto;
	margin: 36px auto;
	display:grid;
 	justify-content: center;
	grid-gap: 2px;
	grid-template: repeat(3,230px) / repeat(2,320px);
	} main img {
        width: 320px;
    } main img:nth-child(1) {
        grid-area: 2/1/1/1;
    } main img:nth-child(2) {
        grid-area: 3/2/1/4;
    } main img:nth-child(3) {
        grid-area: 2/1/3/4;
	} header h1 {
		font-family: Cambria, "Hoefler Text", "Liberation Serif", Times, "Times New Roman", "serif";
		font-size: 48px;
		text-align: center;
		color:rgba(99,8,43,1.00);
	} header img {
		width: 100%;
		height: 100%;
	} .berenice {
        width: 200px;
        position: relative;
        top: -200vh;
		left: 20vw;
		z-index:1;
		animation-name: down;
		animation-duration: 8s;
		animation-fill-mode:backwards;
		animation-timing-function: ease-in;
		animation-delay:1s;
	} @keyframes down {
		0% {top: -200vh; transform:rotate(10deg);}
		40% {transform: rotate(45deg);}
		50% {transform: rotate(60deg);}
		65% {transform: rotate(75deg);}
		70% {transform: rotate(90deg);}
		80% {transform: rotate(120deg);}
		90% {transform: rotate(190deg);}
		100% {top: 30vh; rotate(240deg);}
	</style>
	
	<body>
	<div id=page>
		<header>
		<img src="img3.png"/>
		<h1> Grid of (3+1) drawings</h1>
		</header>
		<main>
		<img src="img2.png"/>
		<img src="img4.png"/>
		<img src="img5.png"/>
		</main>
		
		<img class="berenice" src="bernie.png">
	</div>
</body>
</html>
